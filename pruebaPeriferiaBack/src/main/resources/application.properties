spring.application.name=periferia
# ==========================================
# CONFIGURACI�N DE BASE DE DATOS (POSTGRESQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/prueba_periferia
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuraci�n de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# CONFIGURACI�N DEL SERVIDOR (BACKEND)
# ==========================================
server.port=8080
server.servlet.context-path=/api/v1

# ==========================================
# CONFIGURACI�N SSH (PARA EXPORTACI�N)
# ==========================================
periferia.ssh.host=192.168.1.100
periferia.ssh.port=22
periferia.ssh.user=admin_ssh
periferia.ssh.password=secreto_periferia
periferia.ssh.remote-path=/home/export/files

# ==========================================
# SEGURIDAD JWT (SECRET KEY)
# ==========================================
# Usa una clave larga y segura para firmar los tokens
security.jwt.secret-key=EstaEsUnaClaveSuperSecretaParaPeriferia2026
security.jwt.expiration-time=3600000