# Perfil de test: H2 en memoria. Usado por @ActiveProfiles("test") en tests
# que necesitan levantar el ApplicationContext completo pero NO dependen del
# trigger/función específicos de Postgres (esos van con Testcontainers real,
# ver *RepositoryImplIT). Evita que "mvn test" necesite Postgres corriendo.
spring.datasource.url=jdbc:h2:mem:periferia_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

security.jwt.secret-key=ClaveDePruebaSoloParaTestsNoUsarEnProduccion2026
security.jwt.expiration-time=3600000
