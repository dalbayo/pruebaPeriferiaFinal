<div class="auth-wrapper pt-5">
  <mat-card class="forgot-password-card">
    <mat-card-header>
      <mat-card-title class="mb-3">Olvidé mi contraseña</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width me-2">
          <mat-label>Usuario</mat-label>
          <input matInput type="text" formControlName="username" required />
          @if (!forgotPasswordForm.get('username')?.valid) {
            <mat-error>El usuario es requerido</mat-error>
          }
        </mat-form-field>

        <button
          class="full-width"
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="forgotPasswordForm.invalid"
        >
          Restablecer contraseña
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button color="accent" routerLink="/login" class="full-width">
        Volver a iniciar sesión
      </button>
    </mat-card-actions>
  </mat-card>
</div>
