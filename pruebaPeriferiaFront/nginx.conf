# =============================================================================
# nginx.conf - Frontend Angular 17 (periferia-frontend)
# Sirve el build de producción y hace de proxy de /api/v1/ hacia el backend
# dentro de la red de docker-compose (mismo origen para el navegador -> sin
# necesidad de configurar CORS en el backend).
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Backend Spring Boot (context-path /api/v1, definido en
    # application.properties) — se reenvía tal cual, sin reescribir la ruta.
    location /api/v1/ {
        proxy_pass http://backend:8080/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback de Angular Router: cualquier ruta que no sea un archivo real
    # (assets, js, css) se resuelve con index.html para que el router del
    # lado del cliente la maneje (evita 404 al refrescar /publicaciones, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para assets con hash en el nombre (JS/CSS de producción)
    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
